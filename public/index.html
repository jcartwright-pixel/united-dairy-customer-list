<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Customer List</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/udcl.css">
</head>
<body class="udcl-page" data-help="home">
  <div class="signin" id="signin" hidden>
    <h1>Customer List</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>
  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="head"><div class="title"><span class="eyebrow">United Dairy Customer List &middot; <span id="plant-name"></span></span><h1>Customer List</h1></div></div>
    <div class="udcl-home" id="tiles"></div>
    <p class="udcl-help" id="imported"></p>
    <div class="udcl-install" id="install-box" hidden>
      <b>Get the Customer List app</b>
      <span id="install-how">It opens on this computer in its own window, with its own icon, like the Operations app.</span>
      <button type="button" class="primary" id="install">Install the app</button>
    </div>
  </div>
  <script type="module">import { requireSignIn, SCREENS, escapeHtml as e, showError, serverText, shortDate, installed, installApp, canInstall } from './js/shell.js';
import { readList } from './js/udcl.js';
document.getElementById('tiles').innerHTML = SCREENS.filter(s => s.href !== 'index.html').map(s => '<a href="' + s.href + '"' + (s.admin ? ' class="admin-only"' : '') + '><strong>' + e(s.name) + '</strong>' + e(s.note) + '</a>').join('');
// Joe 11/1: "want to downloadable app" ... "This has to be the desktop version": Install opens the browser's own box (Chrome or
// Edge on a computer). There is no phone app.
function showInstall() {
  document.getElementById('install-box').hidden = installed() || !canInstall();
}
document.addEventListener('udcl-installable', showInstall);
document.getElementById('install').onclick = async () => { await installApp(); showInstall(); };
showInstall();
requireSignIn(async () => {
  try {
    const d = await readList();
    document.getElementById('plant-name').textContent = d.plantName || '';
    const n = Object.keys(d.customers || {}).length, r = (d.routeDays || []).length;
    document.getElementById('imported').textContent = n ? n + ' customers on ' + r + ' route days' + (d.imported && d.imported.at ? ' · last import ' + shortDate(d.imported.at) + ' by ' + (d.imported.by || '') : '') + '.' : 'The list is empty. An administrator imports the Route Menu on Customers.';
  } catch (err) { showError(serverText(err, 'the customer list')); }
});</script>
</body>
</html>
