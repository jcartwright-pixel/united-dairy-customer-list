<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Customer List</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/udcl.css">
</head>
<body class="udcl-page udcl-home-page" data-help="home" data-nav="none">
  <!-- Joe 11-12-26: "Make this home screen a lot better ... more detail, maybe in the menu option like we have on the left".
       The menu down the left side; on the right what the list holds. udcl-home.js draws it. -->
  <div class="signin" id="signin" hidden>
    <h1>Customer List</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>
  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="hm-layout">
      <aside class="hm-side" aria-label="Customer List screens">
        <h2 class="hm-side-title">Menu</h2>
        <nav class="hm-menu" id="home-menu"></nav>
        <div class="udcl-install hm-install" id="install-box" hidden>
          <b>Get the Customer List app</b>
          <span id="install-how">It opens on this computer in its own window, with its own icon, like the Operations app.</span>
          <button type="button" class="primary" id="install">Install the app</button>
        </div>
      </aside>
      <main class="hm-main">
        <div class="head"><div class="title"><span class="eyebrow">United Dairy Customer List &middot; <span id="plant-name"></span></span><h1>Customer List</h1><small id="hm-asof"></small></div>
          <!-- Joe 11-14-26: "I should be able to choose my DC center". -->
          <label class="hm-dc">Location <select id="dcpick" aria-label="Location (DC)"></select></label></div>
        <div id="home-body">
          <section class="hm-card" id="hm-empty" hidden></section>
          <div id="hm-full">
          <div class="hm-tiles" id="hm-tiles"></div>
          <div class="hm-grid">
            <section class="hm-card"><h2><span class="ico" style="-webkit-mask-image:url(img/icons/chart-column.svg);mask-image:url(img/icons/chart-column.svg)" aria-hidden="true"></span>The week</h2><div id="hm-week"></div></section>
            <section class="hm-card"><h2><span class="ico" style="-webkit-mask-image:url(img/icons/list-checks.svg);mask-image:url(img/icons/list-checks.svg)" aria-hidden="true"></span>Missing on active customers</h2><div id="hm-missing"></div></section>
            <section class="hm-card hm-wide"><h2><span class="ico" style="-webkit-mask-image:url(img/icons/history.svg);mask-image:url(img/icons/history.svg)" aria-hidden="true"></span>Newest changes</h2><div id="hm-changes"></div></section>
          </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/udcl-rules.js"></script>
  <script type="module">import './js/udcl-home.js';</script>
</body>
</html>
